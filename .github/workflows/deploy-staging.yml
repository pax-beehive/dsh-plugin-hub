name: Deploy staging

on:
  workflow_dispatch:

concurrency:
  group: dsh-plugin-hub-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: pnpm deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify AuthKit sign-in chain
        run: >-
          curl --fail --silent --show-error --location --max-redirs 4
          --cookie-jar "$RUNNER_TEMP/authkit.cookies"
          --cookie "$RUNNER_TEMP/authkit.cookies"
          --output /dev/null
          https://staging.dshpluginhub.ai/sign-in
